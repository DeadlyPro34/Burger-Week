<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+Grund:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
  
    <div class="wrapper" id="authWrapper">
        <form id="authForm" onsubmit="event.preventDefault(); return handleAuth();">
            <h1 id="formTitle">Login</h1>
            
            <div class="input-box" id="nameContainer" style="display: none;">
                <input type="text" id="uname" placeholder="Username">
                <i class='bx bxs-user'></i>
            </div>
            
            <div class="input-box">
                <input type="email" id="email" placeholder="E-mail" required>
                <i class='bx bx-envelope'></i>
            </div>
            
            <div class="input-box">
                <input type="password" id="pass" placeholder="Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="role-selection" id="roleSelectorDiv">
                <select id="roleSelect">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="remember-forgot" id="extraOptions">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn" id="submitBtn">Login</button>
            
            <div class="register-link" style="text-align: center; margin-top: 15px; font-size: 14.5px; color: black; font-weight: 600;">
                <p id="toggleText">Don't have an account? <a href="javascript:void(0)" onclick="toggleMode()" style="color: black; text-decoration: underline;">Register</a></p>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
